        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

              bytes.push(b & 0xff);

          }
        }
      }

let state,db,page='Dashboard',query='',classFilter='',statusFilter='',pageNo=1,pageSize=25;
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',4500)}
async function start(){try{db=await new Promise((res,rej)=>{let r=indexedDB.open('MtCalvaryStudentManagerHTML',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});state=await new Promise((res,rej)=>{let r=db.transaction('data').objectStore('data').get('school');r.onsuccess=()=>res(r.result||initial());r.onerror=()=>rej(r.error)});render()}catch(e){$('#view').innerHTML='<div class="notice">Browser storage is unavailable. Open this file in a normal Chrome or Edge window, not private browsing.</div>'}}
async function save(next){await new Promise((res,rej)=>{let t=db.transaction('data','readwrite');t.objectStore('data').put(next,'school');t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});state=next}
async function change(fn){let n=structuredClone(state);fn(n);await save(n)}
function go(p){if(document.querySelector('#examMarksForm')&&dirtyMarks()&&!confirm('Leave without saving the entered marks?'))return;page=p;query='';classFilter='';statusFilter='';pageNo=1;render()}
function opts(arr,v){return arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function field(k,label,value='',type='text',required=false){return `<label>${label}<input name="${k}" type="${type}" value="${esc(value)}" ${required?'required':''} maxlength="${k==='name'?100:250}"></label>`}
function select(k,label,arr,v){return `<label>${label}<select name="${k}">${opts(arr,v)}</select></label>`}
function openForm(title,html,submit){$('#modal').innerHTML=`<h2>${title}</h2><form><div class="grid">${html}</div><div id="formError" role="alert" class="full"></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button><button>Save</button></div></form>`;$('#modal').showModal();$('#modal form').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{await submit(new FormData(e.target));closeModal();render();toast('Saved successfully')}catch(err){$('#formError').textContent=err.message}finally{b.disabled=false}}}
function closeModal(){$('#modal').close()}
async function imageData(file,old){if(!file?.size)return old||'';if(file.size>5*1024*1024)throw Error('Image must be below 5 MB.');if(!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use JPG, PNG or WEBP images.');let src=URL.createObjectURL(file);try{let img=await new Promise((res,rej)=>{let i=new Image;i.onload=()=>res(i);i.onerror=()=>rej(Error('Invalid image'));i.src=src});let c=document.createElement('canvas'),scale=Math.min(1,500/img.width,500/img.height);c.width=img.width*scale;c.height=img.height*scale;let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.8)}finally{URL.revokeObjectURL(src)}}
function filtered(){let q=query.toLowerCase();return state.students.filter(s=>(!classFilter||s.class===classFilter)&&(!statusFilter||s.status===statusFilter)&&[s.name,s.admission,s.guardian,s.phone,s.studentId].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name))}
function student(id){return state.students.find(s=>s.id===id)}
function balance(id){return state.charges.filter(x=>x.student===id).reduce((t,x)=>t+x.amount,0)-state.payments.filter(x=>x.student===id).reduce((t,x)=>t+x.amount,0)}
function render(){upgradeData(state);let s=state.settings;$('#sideBrand').innerHTML=`${s.logo?`<img class="brandimg" src="${s.logo}" alt="School logo">`:''}<h2>${esc(s.name)}</h2>`;$('#sessionLabel').textContent=s.session+' • '+s.address;$('#title').textContent=page;$('#nav').innerHTML=ALL_PAGES.map(p=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${p}</button>`).join('');({Dashboard:dashboard,Students:students,Classes:classes,Attendance:attendance,'Fees & Receipts':fees,'Fee Settings':feeSettings,'Subject Settings':subjectSettings,Examinations:examsView,'Bulk ID Cards':bulkIDs,Hostel:hostelView,Promotion:promotionView,Reports:reportsView,Certificates:certificatesView,'Staff & Salary':staffView,Timetable:timetableView,Messages:messagesView,'Legacy Marks':marks,'Settings & Backup':settings,Help:help}[page])()}
function dashboard(){let active=state.students.filter(s=>s.status==='Active').length,received=state.payments.reduce((t,p)=>t+p.amount,0),due=state.students.reduce((t,s)=>t+balance(s.id),0);$('#view').innerHTML=`<div class="grid">${[['Active students',active],['Classes',state.classes.length],['Fees collected',money(received)],['Outstanding',money(due)]].map(([l,v])=>`<div class="panel"><div class="muted">${l}</div><div class="stat">${v}</div></div>`).join('')}</div><div class="panel"><div class="bar"><div><h2>School records, in one place</h2><p class="muted">Manage admissions, family contacts, photographs and student records.</p></div><button onclick="editStudent()">+ Add student</button></div><div class="toolbar"><button class="secondary" onclick="go('Students')">Open student register</button><button class="secondary" onclick="go('Fees & Receipts')">Record a payment</button></div></div><div class="notice">${state.lastBackup?'Last backup requested: '+esc(state.lastBackup):'No backup downloaded yet.'} Download backups regularly. Clearing browser data can erase these records.</div><div class="panel"><h2>Recent admissions</h2>${studentTable([...state.students].reverse().slice(0,5))}</div>`}
function studentTable(rows){if(!rows.length)return '<div class="empty">No students found. Add a student to begin.</div>';return `<div class="scroll"><table><thead><tr><th>Admission</th><th>Student</th><th>Class / Section</th><th>Guardian / Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s.admission)}</td><td>${s.photo?`<img class="avatar" src="${s.photo}" alt=""> `:''}${esc(s.name)}</td><td>${esc(s.class)} / ${esc(s.section)}</td><td>${esc(s.guardian)}<br>${esc(s.phone)}</td><td><span class="tag">${esc(s.status)}</span></td><td><button onclick="profile('${s.id}')">View</button><button class="secondary" onclick="editStudent('${s.id}')">Edit</button><button class="secondary" onclick="cards(['${s.id}'])">ID card</button><button class="danger" onclick="deleteStudent('${s.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}
function students(){let rows=filtered(),total=Math.max(1,Math.ceil(rows.length/pageSize));pageNo=Math.min(pageNo,total);$('#view').innerHTML=`<div class="panel"><div class="bar"><h2>Student register <small class="muted">(${rows.length})</small></h2><button onclick="editStudent()">+ Add student</button></div><div class="toolbar"><input id="search" placeholder="Search name, admission, guardian, phone…" value="${esc(query)}"><select id="classFilter"><option value="">All classes</option>${opts(state.classes,classFilter)}</select><select id="statusFilter"><option value="">All statuses</option>${opts(['Active','Inactive','Transferred','Graduated','Withdrawn'],statusFilter)}</select></div><div class="toolbar"><button class="secondary" onclick="printRegister()">Print register</button><button class="secondary" onclick="cards(filtered().map(s=>s.id))">Print filtered ID cards</button><button class="secondary" onclick="exportCSV()">Export CSV</button></div>${studentTable(rows.slice((pageNo-1)*pageSize,pageNo*pageSize))}<div class="bar" style="margin-top:18px"><span>Page ${pageNo} of ${total}</span><div><button class="secondary" ${pageNo===1?'disabled':''} onclick="pageNo--;students()">Previous</button> <button class="secondary" ${pageNo===total?'disabled':''} onclick="pageNo++;students()">Next</button></div><label>Rows<select onchange="pageSize=Number(this.value);pageNo=1;students()">${opts(['25','50','100'],String(pageSize))}</select></label></div></div>`;$('#search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;pageNo=1;students();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#classFilter').onchange=e=>{classFilter=e.target.value;pageNo=1;students()};$('#statusFilter').onchange=e=>{statusFilter=e.target.value;pageNo=1;students()}}
function editStudent(id){let s=student(id)||{admission:'MCEHS'+String(Math.max(0,...state.students.map(s=>Number(s.admission.replace(/^MCEHS/,''))||0))+1).padStart(5,'0'),status:'Active',admissionDate:today(),session:state.settings.session};openForm(id?'Edit student':'Add student',field('admission','Admission number *',s.admission,'text',true)+field('studentId','Student ID',s.studentId)+field('name','Full name *',s.name,'text',true)+select('gender','Gender',['Not specified','Male','Female','Other'],s.gender)+field('dob','Date of birth',s.dob,'date')+field('blood','Blood group',s.blood)+select('class','Class',state.classes,s.class)+field('section','Section',s.section||'A')+field('roll','Roll number',s.roll)+field('session','Academic session',s.session)+field('admissionDate','Admission date',s.admissionDate,'date')+select('status','Status',['Active','Inactive','Transferred','Graduated','Withdrawn'],s.status)+field('guardian','Parent / guardian',s.guardian)+field('mother','Mother’s name',s.mother)+field('phone','Guardian / emergency phone',s.phone,'tel')+field('email','Email',s.email,'email')+`<label class="full">Address<textarea name="address" maxlength="1000">${esc(s.address)}</textarea></label><label>Profile photo<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"><small>JPG / PNG / WEBP, up to 5 MB; automatically compressed.</small></label><label>Remove existing photo<input name="removePhoto" type="checkbox" style="width:auto"></label><label class="full">Remarks<textarea name="remarks" maxlength="2000">${esc(s.remarks)}</textarea></label>`,async f=>{let v=Object.fromEntries(f);delete v.photo;delete v.removePhoto;Object.keys(v).forEach(k=>v[k]=v[k].trim());if(!v.name||!v.admission)throw Error('Name and admission number are required.');if(state.students.some(x=>x.id!==id&&x.admission.toLowerCase()===v.admission.toLowerCase()))throw Error('Admission number already exists.');if(v.studentId&&state.students.some(x=>x.id!==id&&x.studentId===v.studentId))throw Error('Student ID already exists.');if(v.dob&&v.dob>today())throw Error('Date of birth cannot be in the future.');v.photo=await imageData(f.get('photo'),f.has('removePhoto')?'':s.photo);v.id=id||uid();await change(n=>{let i=n.students.findIndex(x=>x.id===id);i<0?n.students.push(v):n.students[i]=v})})}
async function deleteStudent(id){if(state.charges.some(x=>x.student===id)||state.payments.some(x=>x.student===id)){toast('This student has financial records. Change status to Inactive instead.');return}if(!confirm('Delete this student and their attendance/marks? This cannot be undone without a backup.'))return;try{await change(n=>{n.students=n.students.filter(s=>s.id!==id);n.attendance=n.attendance.filter(s=>s.student!==id);n.marks=n.marks.filter(s=>s.student!==id)});render()}catch(e){toast(e.message)}}
function printHead(title){let s=state.settings;return `<div class="printhead">${s.logo?`<img class="brandimg" src="${s.logo}">`:''}<div><h2>${esc(s.name)}</h2><p>${esc(s.address)}${s.recognition?'<br>'+esc(s.recognition):''} · ${esc(s.phone)}<br>${esc(s.session)} · ${esc(title)}</p><small>Developed by Hegin Haokip - 9612338375</small></div></div>`}
function preview(html){$('#printArea').innerHTML=html;$('#modal').innerHTML=`<div class="printtools"><button onclick="window.print()">Print / Save PDF</button> <button class="secondary" onclick="closeModal()">Close preview</button><p class="muted">A4 portrait · Scale 100% / Actual size · Disable browser headers and footers.</p></div>${html}`;$('#modal').showModal()}
function profile(id){let s=student(id);preview(printHead('Student record')+`<div class="panel">${s.photo?`<img src="${s.photo}" style="width:90px;height:110px;object-fit:cover;float:right">`:''}<h2>${esc(s.name)}</h2><table>${Object.entries({Admission:s.admission,'Student ID':s.studentId,Class:s.class,Section:s.section,Roll:s.roll,Session:s.session,Gender:s.gender,'Date of birth':s.dob,'Blood group':s.blood,'Admission date':s.admissionDate,Guardian:s.guardian,Mother:s.mother,Phone:s.phone,Email:s.email,Address:s.address,Status:s.status,Remarks:s.remarks}).map(([k,v])=>`<tr><th>${k}</th><td>${esc(v)}</td></tr>`).join('')}</table></div>`)}
function printRegister(){preview(printHead('Student register')+`<p>Class: ${esc(classFilter||'All')} · Status: ${esc(statusFilter||'All')} · Search: ${esc(query||'None')} · ${filtered().length} students</p><table><thead><tr><th>No.</th><th>Admission</th><th>Name</th><th>Class / Section</th><th>Guardian</th><th>Phone</th><th>Status</th></tr></thead><tbody>${filtered().map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.admission)}</td><td>${esc(s.name)}</td><td>${esc(s.class)} / ${esc(s.section)}</td><td>${esc(s.guardian)}</td><td>${esc(s.phone)}</td><td>${esc(s.status)}</td></tr>`).join('')}</tbody></table>`)}
function cards(ids){if(!ids.length)return toast('No students selected.');let z=state.settings;preview(`<div class="cards">${ids.map(id=>{let s=student(id);return `<article class="idcard"><h3>${esc(z.name)}</h3>${z.logo?`<img class="tinylogo" src="${z.logo}"><br>`:''}${s.photo?`<img class="portrait" src="${s.photo}">`:'<div class="portrait" style="display:block">STUDENT</div>'}<p><strong>${esc(s.name)}</strong></p><p>Admission: ${esc(s.admission)}</p><p>Class: ${esc(s.class)} – ${esc(s.section)} · Roll: ${esc(s.roll)}</p><p>DOB: ${esc(s.dob)} · Blood: ${esc(s.blood||'—')}</p><p>Session: ${esc(s.session)}</p><p>Emergency: ${esc(s.phone||'—')}</p><p>School: ${esc(z.phone||'—')}</p><div class="signature">Principal / Authorized signatory</div></article>`}).join('')}</div>`)}
function download(name,text,type='application/json'){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}
function exportCSV(){let keys=['admission','studentId','name','class','section','roll','session','gender','dob','guardian','mother','phone','email','address','status'];let cell=x=>'"'+(/^[=+@\-\t\r]/.test(String(x??''))?"'":'')+String(x??'').replace(/"/g,'""')+'"';download('Student_Register.csv','\ufeff'+[keys,...filtered().map(s=>keys.map(k=>s[k]))].map(r=>r.map(cell).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function classes(){$('#view').innerHTML=`<div class="panel"><h2>Manage classes</h2><p>Class changes apply to linked students.</p><div class="toolbar"><input id="newClass" placeholder="New class name"><button onclick="addClass()">Add class</button></div><table>${state.classes.map((c,i)=>`<tr><td>${esc(c)}</td><td>${state.students.filter(s=>s.class===c).length} students</td><td><button class="secondary" onclick="renameClass(${i})">Rename</button><button class="danger" onclick="removeClass(${i})">Delete</button></td></tr>`).join('')}</table></div>`}
async function addClass(){let c=$('#newClass').value.trim();if(!c||state.classes.some(x=>x.toLowerCase()===c.toLowerCase()))return toast('Enter a unique class name.');await change(n=>n.classes.push(c));render()}
async function renameClass(i){let old=state.classes[i],c=prompt('New class name',old)?.trim();if(!c||c===old)return;if(state.classes.some(x=>x.toLowerCase()===c.toLowerCase()))return toast('Class already exists.');await change(n=>{n.classes[i]=c;n.students.forEach(s=>{if(s.class===old)s.class=c});for(let key of ['feeSettings','classSubjects','examinations'])n[key].forEach(r=>{if(r.class===old)r.class=c})});render()}
async function removeClass(i){let c=state.classes[i];if(state.students.some(s=>s.class===c)||['feeSettings','classSubjects','examinations'].some(k=>state[k].some(r=>r.class===c)))return toast('This class has linked students, settings or examinations. Remove or move those records first.');if(confirm('Delete class '+c+'?')){await change(n=>n.classes.splice(i,1));render()}}
let attDate=today(),attClass='',attMonth=today().slice(0,7);
function attendance(){let list=state.students.filter(s=>s.status==='Active'&&(!attClass||s.class===attClass));$('#view').innerHTML=`<div class="panel"><h2>Daily attendance</h2><div class="toolbar"><input type="date" value="${attDate}" onchange="attDate=this.value;attendance()"><select onchange="attClass=this.value;attendance()"><option value="">All classes</option>${opts(state.classes,attClass)}</select></div><form id="attForm"><div class="scroll"><table><thead><tr><th>Student</th><th>Class / Section</th><th>Status</th></tr></thead><tbody>${list.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.class)} / ${esc(s.section)}</td><td><select name="${s.id}">${opts(['Unmarked','Present','Absent','Late','Half Day','Excused'],state.attendance.find(a=>a.student===s.id&&a.date===attDate)?.status||'Unmarked')}</select></td></tr>`).join('')}</tbody></table></div><div class="actions"><button ${!list.length?'disabled':''}>Save attendance</button></div></form></div><div class="panel"><h2>Monthly attendance report</h2><label>Month<input type="month" value="${attMonth}" onchange="attMonth=this.value;attendance()"></label><p class="muted">Recorded days are the denominator; Present/Late = 1, Half Day = 0.5, Absent = 0. Excused and unmarked days are excluded. No school calendar is inferred.</p><button onclick="attendanceReport()">Preview / print report</button></div>`;$('#attForm').onsubmit=async e=>{e.preventDefault();if(!attDate)return toast('Choose a date.');let entries=[...new FormData(e.target)];try{await change(n=>{for(let [id,status] of entries){n.attendance=n.attendance.filter(a=>!(a.student===id&&a.date===attDate));if(status!=='Unmarked')n.attendance.push({student:id,date:attDate,status})}});toast('Attendance saved')}catch(err){toast(err.message)}}}
function attendanceReport(){let rows=state.students.filter(s=>!attClass||s.class===attClass).map(s=>{let a=state.attendance.filter(a=>a.student===s.id&&a.date.startsWith(attMonth)&&a.status!=='Excused'),p=a.reduce((n,x)=>n+({Present:1,Late:1,'Half Day':.5,Absent:0}[x.status]||0),0);return `<tr><td>${esc(s.name)}</td><td>${esc(s.class)}</td><td>${a.length}</td><td>${p}</td><td>${a.length?(p/a.length*100).toFixed(1)+'%':'—'}</td><td>${a.length&&p/a.length*100<state.settings.threshold?'Below threshold':''}</td></tr>`});preview(printHead('Attendance • '+attMonth)+`<p>Class: ${esc(attClass||'All')} · Threshold: ${state.settings.threshold}%</p><table><thead><tr><th>Student</th><th>Class</th><th>Recorded days</th><th>Present equivalent</th><th>%</th><th>Flag</th></tr></thead><tbody>${rows.join('')}</tbody></table>`)}
function fees(){$('#view').innerHTML=`<div class="panel"><div class="bar"><h2>Student fee ledger</h2><div><button onclick="feeForm(false)">+ Fee charge</button> <button onclick="feeForm(true)">+ Payment</button></div></div><p class="muted">Amounts are stored in paise. Enter the net charge after any concession. Charges and payments can be edited or deleted from Fees & Receipts.</p><div class="scroll"><table><thead><tr><th>Student</th><th>Admission</th><th>Outstanding</th><th>Ledger</th></tr></thead><tbody>${state.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.admission)}</td><td>${money(balance(s.id))}</td><td><button onclick="ledger('${s.id}')">View / print</button></td></tr>`).join('')}</tbody></table></div></div><div class="panel"><h2>Payment receipts</h2><div class="scroll"><table><tr><th>Receipt</th><th>Date</th><th>Student</th><th>Amount</th><th></th></tr>${[...state.payments].reverse().map(p=>`<tr><td>${esc(p.receipt)}</td><td>${esc(p.date)}</td><td>${esc(student(p.student)?.name)}</td><td>${money(p.amount)}</td><td><button onclick="receipt('${p.id}')">Receipt</button></td></tr>`).join('')}</table></div></div>`}
function feeForm(payment){if(!state.students.length)return toast('Add a student first.');openForm(payment?'Record payment':'Create fee charge',`<label class="full">Student<select name="student">${state.students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${esc(s.admission)}</option>`).join('')}</select></label>`+field('date','Date',today(),'date',true)+`<label>Amount (₹) *<input name="amount" type="number" min="0.01" max="10000000" step="0.01" required></label>`+field('description',payment?'Payment description':'Fee type / month','','text',true)+(payment?select('mode','Payment mode',['Cash','Bank','UPI','Cheque','Online','Other'],'Cash')+field('reference','Transaction reference'):''),async f=>{let r=Object.fromEntries(f);r.amount=Math.round(Number(r.amount)*100);if(!Number.isSafeInteger(r.amount)||r.amount<=0)throw Error('Enter a valid positive amount.');if(payment&&r.amount>balance(r.student))throw Error('Payment exceeds outstanding fees. Create the charge first.');r.id=uid();if(payment)r.receipt='MCS-'+String(state.payments.length+1).padStart(6,'0');await change(n=>n[payment?'payments':'charges'].push(r))})}
function receipt(id){let p=state.payments.find(p=>p.id===id),s=student(p.student);preview(printHead('Fee receipt')+`<h2>${esc(p.receipt)}</h2><p>Date: ${esc(p.date)}<br>Received from: ${esc(s.name)} · ${esc(s.admission)}<br>Class: ${esc(s.class)} / ${esc(s.section)}</p><table><tr><th>Description</th><th>Amount</th></tr><tr><td>${esc(p.description)}</td><td>${money(p.amount)}</td></tr></table><p>Mode: ${esc(p.mode)} · Reference: ${esc(p.reference||'—')}</p><p style="margin-top:45px">Received by: ____________________</p>`)}
function ledger(id){let s=student(id),rows=[...state.charges.filter(p=>p.student===id).map(x=>({...x,type:'Charge'})),...state.payments.filter(p=>p.student===id).map(x=>({...x,type:'Payment'}))].sort((a,b)=>a.date.localeCompare(b.date));preview(printHead('Student fee ledger')+`<h2>${esc(s.name)} · ${esc(s.admission)}</h2><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th></tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.date)}</td><td>${p.type}</td><td>${esc(p.description)}</td><td>${money(p.amount)}</td></tr>`).join('')}</tbody></table><h2>Outstanding: ${money(balance(id))}</h2>`)}
function marks(){$('#view').innerHTML=`<div class="panel"><div class="bar"><h2>Examination marks</h2><button onclick="markForm()">+ Enter marks</button></div><p class="muted">Each entry has its own exam and subject maximum/pass mark. This edition calculates totals and percentages; it does not assign grades or ranks.</p><div class="scroll"><table><tr><th>Student</th><th>Exam</th><th>Subject</th><th>Marks</th><th>Actions</th></tr>${state.marks.map(m=>`<tr><td>${esc(student(m.student)?.name)}</td><td>${esc(m.exam)}</td><td>${esc(m.subject)}</td><td>${m.score} / ${m.max}</td><td><button class="secondary" onclick="markForm('${m.id}')">Edit</button><button onclick="markReport('${m.id}')">Report</button><button class="danger" onclick="removeMark('${m.id}')">Delete</button></td></tr>`).join('')}</table></div></div>`}
function markForm(id){if(!state.students.length)return toast('Add a student first.');let m=state.marks.find(x=>x.id===id)||{};openForm('Marks entry',`<label class="full">Student<select name="student">${state.students.map(s=>`<option value="${s.id}" ${m.student===s.id?'selected':''}>${esc(s.name)} · ${esc(s.admission)}</option>`).join('')}</select></label>`+field('exam','Exam / session *',m.exam,'text',true)+field('subject','Subject *',m.subject,'text',true)+field('score','Marks obtained *',m.score,'number',true)+field('max','Maximum marks *',m.max||100,'number',true)+field('pass','Pass marks *',m.pass??40,'number',true),async f=>{let r=Object.fromEntries(f);r.exam=r.exam.trim();r.subject=r.subject.trim();['score','max','pass'].forEach(k=>r[k]=Number(r[k]));if(!r.exam||!r.subject||r.max<=0||r.score<0||r.score>r.max||r.pass<0||r.pass>r.max)throw Error('Check exam, subject and mark ranges.');if(state.marks.some(x=>x.id!==id&&x.student===r.student&&x.exam.toLowerCase()===r.exam.toLowerCase()&&x.subject.toLowerCase()===r.subject.toLowerCase()))throw Error('Marks already exist for this student, exam and subject. Use Edit.');r.id=id||uid();await change(n=>{let i=n.marks.findIndex(x=>x.id===id);i<0?n.marks.push(r):n.marks[i]=r})})}
async function removeMark(id){if(confirm('Delete this mark?')){await change(n=>n.marks=n.marks.filter(x=>x.id!==id));render()}}
function markReport(id){let m=state.marks.find(x=>x.id===id),s=student(m.student),a=state.marks.filter(x=>x.student===m.student&&x.exam===m.exam),total=a.reduce((t,x)=>t+x.score,0),max=a.reduce((t,x)=>t+x.max,0);preview(printHead('Marks statement • '+m.exam)+`<h2>${esc(s.name)}</h2><p>${esc(s.admission)} · Class ${esc(s.class)} / ${esc(s.section)}</p><table><tr><th>Subject</th><th>Obtained</th><th>Maximum</th><th>Pass mark</th><th>Result</th></tr>${a.map(x=>`<tr><td>${esc(x.subject)}</td><td>${x.score}</td><td>${x.max}</td><td>${x.pass}</td><td>${x.score>=x.pass?'Pass':'Fail'}</td></tr>`).join('')}</table><p>Total: ${total} / ${max} · Percentage: ${(total/max*100).toFixed(2)}% · ${a.every(x=>x.score>=x.pass)?'Pass':'Fail'} (recorded subjects only)</p><p style="margin-top:50px">Class teacher: ____________________ &nbsp; Principal: ____________________</p>`)}
function settings(){let s=state.settings;$('#view').innerHTML=`<div class="panel"><h2>School settings</h2><form id="settingsForm"><div class="grid">${field('name','School name *',s.name,'text',true)}${field('session','Academic session',s.session)}${field('address','Address',s.address)}${field('recognition','Govt Recognized',s.recognition)}${field('phone','School phone',s.phone)}<label>Low attendance threshold (%)<input name="threshold" type="number" min="0" max="100" value="${s.threshold}" required></label><label>Change school logo<input type="file" name="logo" accept="image/png,image/jpeg,image/webp"></label><label>Remove logo<input type="checkbox" name="removeLogo" style="width:auto"></label></div><div class="actions"><button>Save settings</button></div></form></div><div class="panel"><h2>Login and backup</h2><button onclick="changePasswordForm()">Change username / password</button><p>Records and new backups are encrypted. Keep the password used for each backup. Automatic lock: 15 minutes of inactivity.</p><p>Backups include students, compressed photos, logo, attendance, fees and marks. Keep them in a safe folder or external drive. CSV exports do not contain photos or other modules.</p><button onclick="backup()">Download full backup</button><hr><label>Restore this application’s JSON backup<input type="file" accept=".json,application/json" id="restoreFile"></label><button style="margin-top:15px" onclick="restore()">Restore backup…</button><p class="muted">Restore replaces all current records after confirmation. PHP/MySQL SQL files cannot be imported here.</p></div>`;$('#settingsForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let logo=await imageData(f.get('logo'),f.has('removeLogo')?'':s.logo);let banner=s.banner||'';await change(n=>n.settings={name:f.get('name').trim(),session:f.get('session'),address:f.get('address'),recognition:f.get('recognition').trim(),phone:f.get('phone'),threshold:Number(f.get('threshold')),logo,banner});render function validBackup(n){if(!n||n.format!=='mt-calvary-html'||n.version!==1||!n.settings||typeof n.settings.name!=='string')throw Error('Not a supported school backup.');for(let k of ['students','classes','charges','payments','attendance','marks'])if(!Array.isArray(n[k]))throw Error('Missing backup data: '+k);const img=x=>!x||typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x);if(!img(n.settings.logo)||!Number.isFinite(n.settings.threshold)||n.settings.threshold<0||n.settings.threshold>100)throw Error('Invalid settings.');let ids=new Set,ad=new Set;for(let s of n.students){if(typeof s.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(s.id)||ids.has(s.id)||typeof s.name!=='string'||!s.name||typeof s.admission!=='string'||!s.admission||ad.has(s.admission.toLowerCase())||!img(s.photo))throw Error('Invalid or duplicate student.');ids.add(s.id);ad.add(s.admission.toLowerCase());for(let [k,v] of Object.entries(s))if(typeof v!=='string')throw Error('Invalid student fields.')}if(n.classes.some(x=>typeof x!=='string'))throw Error('Invalid classes.');for(let key of ['charges','payments','attendance','marks'])for(let r of n[key]){if(!ids.has(r.student))throw Error('Backup contains an unknown student link.');if(key!=='attendance'&&(typeof r.id!=='string'||!/^[a-zA-Z0-9-]+$/.test(r.id)))throw Error('Invalid record ID.');if(['charges','payments'].includes(key)&&(!Number.isSafeInteger(r.amount)||r.amount<=0))throw Error('Invalid fee amount.');if(key==='attendance'&&(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)||!['Present','Absent','Late','Half Day','Excused'].includes(r.status)))throw Error('Invalid attendance.');if(key==='marks'&&(![r.score,r.max,r.pass].every(Number.isFinite)||r.max<=0||r.score<0||r.score>r.max||r.pass<0||r.pass>r.max))throw Error('Invalid marks.')}for(let k of ['address','phone','session'])if(typeof n.settings[k]!=='string')throw Error('Invalid school settings.');for(let key of ['charges','payments','marks']){let unique=new Set;for(let r of n[key]){if(unique.has(r.id))throw Error('Duplicate record ID.');unique.add(r.id);for(let k of (key==='marks'?['exam','subject']:['date','description']))if(typeof r[k]!=='string'||!r[k].trim())throw Error('Missing record field: '+k);if(key==='payments'&&(typeof r.receipt!=='string'||typeof r.mode!=='string'))throw Error('Invalid receipt.')}}return n}
async function restore(){try{let f=$('#restoreFile').files[0];if(!f)throw Error('Choose a JSON backup first.');if(f.size>100*1024*1024)throw Error('Backup exceeds 100 MB.');let n=validBackup(JSON.parse(await f.text()));if(!confirm(`Replace all current records with ${n.students.length} students from this backup? Download a current backup first if needed.`))return;await save(n);render();toast('Backup restored')}catch(e){toast('Restore failed: '+e.message)}}

// Local encrypted vault: PBKDF2-SHA256 and AES-256-GCM.
let vaultKey=null,vaultMeta=null,vaultRevision=0,vaultSaving=false,idleTimer=null,loginFailures=0,loginRetry=0;
const b64=bytes=>{let out='';for(let b of new Uint8Array(bytes))out+=String.fromCharCode(b);return btoa(out)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveVaultKey(password,salt){let seed=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:600000},seed,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function sealVault(n,key,meta,rev){let iv=crypto.getRandomValues(new Uint8Array(12));let data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(n)));return {format:'mt-calvary-encrypted',version:1,salt:meta.salt,username:meta.username,iv:b64(iv),cipher:b64(data),revision:rev,branding:{name:n.settings.name,logo:n.settings.logo||''}}}
async function openVault(v,password){if(v.format!=='mt-calvary-encrypted'||v.version!==1||typeof v.salt!=='string'||typeof v.iv!=='string'||typeof v.cipher!=='string'||unb64(v.salt).length!==16||unb64(v.iv).length!==12)throw Error('Unsupported encrypted backup.');let key=await deriveVaultKey(password,v.salt);let clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},key,unb64(v.cipher));return {key,data:JSON.parse(new TextDecoder().decode(clear))}}
function readStored(){return new Promise((res,rej)=>{let r=db.transaction('data').objectStore('data').get('school');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function commitVault(v,expected){return new Promise((res,rej)=>{let t=db.transaction('data','readwrite'),o=t.objectStore('data'),r=o.get('school'),conflict=false;r.onsuccess=()=>{let current=r.result;if((current?.format==='mt-calvary-encrypted'?current.revision:0)!==expected){conflict=true;t.abort();return}o.put(v,'school')};t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(Error(conflict?'Records changed in another tab. Log in again before saving.':'Unable to save encrypted records.'))})}
const preSecureUpgrade=upgradeData;upgradeData=function(n){preSecureUpgrade(n);if(n.settings.banner===undefined)n.settings.banner='';n.appVersion=2.3;return n};
start=async function(){document.body.classList.add('locked');try{if(!crypto.subtle)throw Error('Encryption is unavailable. Use current Chrome or Edge.');db=await new Promise((res,rej)=>{let r=indexedDB.open('MtCalvaryStudentManagerHTML',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});await showLogin()}catch(e){document.querySelector('#loginSurface').textContent=e.message}};
async function showLogin(){let stored=await readStored(),setup=stored?.format!=='mt-calvary-encrypted',branding=setup?(stored?.settings||initial().settings):(stored.branding||{});document.body.classList.add('locked');let logo=branding.logo&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(branding.logo)?branding.logo:DEFAULT_LOGO;$('#loginSurface').innerHTML=`<div class="loginCard">${logo?`<img class="loginLogo" src="${logo}" alt="School logo">`:'<div class="loginEmblem">MC</div>'}<h1>${esc(brandName(branding.name))}</h1><p>${setup?'Create your local administrator login':'Sign in to school management'}</p><form id="loginForm"><label>Username<input name="username" autocomplete="username" value="${setup?'admin':''}" required maxlength="80"></label><label>Password<input name="password" type="password" autocomplete="${setup?'new-password':'current-password'}" ${setup?'minlength="12"':''} required></label>${setup?'<label>Confirm password<input name="confirm" type="password" autocomplete="new-password" minlength="12" required></label><p class="muted">Use at least 12 characters. Existing records will be encrypted after setup. Keep this password safely; there is no password reset.</p>':''}<p id="loginError" role="alert"></p><button>${setup?'Create login & encrypt records':'Log in'}</button></form><small>Your school name and logo are visible before login. Student records remain encrypted while locked.<br>Developed by Hegin Haokip - 9612338375</small></div>`;$('#loginForm').onsubmit=async e=>{e.preventDefault();let b=e.submitter;b.disabled=true;try{if(Date.now()<loginRetry)throw Error('Please wait '+Math.ceil((loginRetry-Date.now())/1000)+' seconds before trying again.');let f=new FormData(e.target),username=f.get('username').trim(),password=f.get('password');let current=await readStored();if(setup){if(current?.format==='mt-calvary-encrypted')throw Error('Login was already configured. Reload this page.');if(!username||password.length<12||password!==f.get('confirm'))throw Error('Enter a username and matching passwords of at least 12 characters.');let data=upgradeData(current||initial()),meta={salt:b64(crypto.getRandomValues(new Uint8Array(16))),username},key=await deriveVaultKey(password,meta.salt),encrypted=await sealVault(data,key,meta,1);await commitVault(encrypted,0);vaultKey=key;vaultMeta=meta;vaultRevision=1;state=data}else{try{if(username!==current.username)throw Error('Invalid');let result=await openVault(current,password);vaultKey=result.key;vaultMeta={salt:current.salt,username:current.username};vaultRevision=current.revision;state=upgradeData(result.data)}catch(err){loginFailures++;loginRetry=Date.now()+Math.min(60000,1000*2**Math.min(loginFailures,6));throw Error('Incorrect username/password, or damaged saved data.')}}loginFailures=0;$('#loginSurface').innerHTML='';document.body.classList.remove('locked');page='Dashboard';render();resetIdle()}catch(err){$('#loginError').textContent=err.message}finally{b.disabled=false}}}
save=async function(next){if(!vaultKey)throw Error('Please log in before saving.');if(vaultSaving)throw Error('A save is already in progress. Please try again.');vaultSaving=true;try{let v=await sealVault(next,vaultKey,vaultMeta,vaultRevision+1);await commitVault(v,vaultRevision);vaultRevision=v.revision;state=next;resetIdle()}finally{vaultSaving=false}};

async function bannerData(file,old){if(!file?.size)return old||'';if(file.size>8*1024*1024||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('Use a JPG, PNG or WEBP banner below 8 MB.');let url=URL.createObjectURL(file);try{let im=await new Promise((res,rej)=>{let x=new Image;x.onload=()=>res(x);x.onerror=()=>rej(Error('Invalid banner image'));x.src=url}),c=document.createElement('canvas'),scale=Math.min(1,1800/im.width,600/im.height);c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);let ctx=c.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.85)}finally{URL.revokeObjectURL(url)}}
function changePasswordForm(){openForm('Change local login',field('username','Username',vaultMeta.username,'text',true)+field('current','Current password','','password',true)+field('password','New password (12+ characters)','','password',true)+field('confirm','Confirm new password','','password',true),async f=>{let username=nonempty(f.get('username'),'Username'),password=f.get('password');if(password.length<12||password!==f.get('confirm'))throw Error('New passwords must match and contain at least 12 characters.');if(vaultSaving)throw Error('Wait for the current save.');vaultSaving=true;try{let stored=await readStored();try{await openVault(stored,f.get('current'))}catch{throw Error('Current password is incorrect.')}let meta={username,salt:b64(crypto.getRandomValues(new Uint8Array(16)))},key=await deriveVaultKey(password,meta.salt),v=await sealVault(state,key,meta,vaultRevision+1);await commitVault(v,vaultRevision);vaultKey=key;vaultMeta=meta;vaultRevision=v.revision}finally{vaultSaving=false}})}

// Explicit examination roster selection; academic session punctuation normalization.
function sameSchoolText(a,b){return String(a||'').trim().toLowerCase().replace(/[–—−]/g,'-').replace(/\s+/g,'')===String(b||'').trim().toLowerCase().replace(/[–—−]/g,'-').replace(/\s+/g,'')}

const beforeHostelUpgrade=upgradeData;upgradeData=function(n){beforeHostelUpgrade(n);if(n.hostelRooms===undefined)n.hostelRooms=[];if(n.hostelStays===undefined)n.hostelStays=[];n.appVersion=2.5;return n};

// ---------- IndexedDB ----------
function idbGet(k){return new Promise((res,rej)=>{let r=db.transaction('data').objectStore('data').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

let photoByUrl=new Map(),urlByKey=new Map(),storedPhotoKeys=new Set(),monthCache=new Map(),v3LoadedFor=null,v3Loading=null,v3Error='',skipChangeStamp=false;

async function buildPersisted(next,key){let puts=[],created=[],referenced=new Set();
  async function conv(obj){let p=obj.photo||'';if(!p)return '';
    if(p.startsWith('blob:')){let m=photoByUrl.get(p);if(!m)return '';referenced.add(m.key);return 'vault:'+m.key}
    if(p.startsWith('vault:')){referenced.add(p.slice(6));return p}
    if(p.startsWith('data:')){let {bytes,type}=dataUrlBytes(p),k='photo:'+uid();puts.push([k,await sealChunk(k,bytes,key,{kind:'image',type})]);created.push({k,bytes,type,obj});referenced.add(k);return 'vault:'+k}

function certificatesView(){let rows=[...state.certificates].reverse();$('#view').innerHTML=`<div class="panel"><div class="bar"><h2>Certificates</h2><div><button onclick="certificateForm('TC')">+ Transfer Certificate</button> <button onclick="certificateForm('Bonafide')">+ Bonafide</button> <button onclick="certificateForm('Character')">+ Character</button></div></div><p class="muted">Each certificate gets a serial number (TC/2026/0001). Reprints are marked DUPLICATE. Issued certificates stay in this register for inspection.</p><div class="scroll"><table><thead><tr><th>Number / date</th><th>Type</th><th>Student</th><th>Class</th><th>Issued by</th><th>Actions</th></tr></thead><tbody>${rows.map(c=>{let s=student(c.student);return `<tr class="${c.cancelled?'cancelled':''}"><td>${esc(c.number)}<br>${esc(fmtDate(c.date))}</td><td>${esc(CERT_TYPES[c.type])}${c.cancelled?'<br><b>CANCELLED</b>':''}</td><td>${esc(s?.name)}<br><small>${esc(s?.admission)}</small></td><td>${esc(c.data.classLast||s?.class)}</td><td>${esc(c.by||'')}</td><td>${!c.cancelled?`<button onclick="printCertificate('${c.id}',true)">Print duplicate</button>`:''}${!c.cancelled&&role()==='admin'?`<button class="danger" onclick="cancelCertificate('${c.id}')">Cancel</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6">No certificates issued yet.</td></tr>'}</tbody></table></div></div>`}
function nextCertNumber(type){let y=new Date().getFullYear(),pre={TC:'TC',Bonafide:'BC',Character:'CC'}[type]+'/'+y+'/',max=0;for(let c of state.certificates)if(c.number.startsWith(pre))max=Math.max(max,Number(c.number.slice(pre.length))||0);return pre+String(max+1).padStart(4,'0')}
async function certificateForm(type){if(!can('certificates'))return toast('Your login cannot issue certificates.');let sid=state.students.find(s=>s.status==='Active')?.id||state.students[0]?.id;if(!sid)return toast('Add a student first.');
  let fields={TC:s=>field('nationality','Nationality','Indian')+field('category','Category (if recorded)','')+field('classAdmitted','Class at first admission','')+field('classLast','Class last studied *',s.class,'text',true)+field('lastExam','Last examination taken and result (e.g. Annual Examination 2026–2027, Passed)','')+select('promoted','Qualified for promotion to higher class',['Yes','No','Not applicable'],'Yes')+field('feesPaid','Fees paid up to (month)','')+field('workingDays','Total working days','')+field('presentDays','Days present','')+field('conduct','General conduct','Good')+field('activities','Games / extra-curricular activities','')+field('applied','Date of application','', 'date')+field('leaving','Date of leaving *',today(),'date',true)+field('reason','Reason for leaving','Parent’s request')+field('remarks','Any other remarks','')+'<label class="full"><input type="checkbox" name="markTransferred" checked style="width:auto"> Set the student’s status to “Transferred”</label>',
    Bonafide:s=>field('session','Academic session *',s.session||state.settings.session,'text',true)+field('purpose','Purpose *','Scholarship application','text',true),
    Character:s=>field('from','Studied from *',s.admissionDate||'','date',true)+field('to','Studied until *',today(),'date',true)+field('conduct','Conduct and character *','good','text',true)};
  openForm('Issue '+CERT_TYPES[type],studentPicker('student','Student *',sid)+'<div class="full" id="certInfo"></div><div class="full grid" id="certFields"></div>'+field('date','Date of issue *',today(),'date',true),async f=>{let s=student(f.get('student'));if(!s)throw Error('Select a student.');let data=Object.fromEntries([...f].filter(([k])=>!['student','date','markTransferred'].includes(k)).map(([k,v])=>[k,String(v).trim()]));
    if(type==='TC'&&state.certificates.some(c=>c.type==='TC'&&c.student===s.id&&!c.cancelled))throw Error('A Transfer Certificate was already issued to this student. Print a duplicate from the register, or cancel the old one first.');
    let due=balance(s.id);if(type==='TC'&&due>0&&!confirm(s.name+' has '+money(due)+' fees outstanding. Issue the TC anyway?'))throw Error('Not issued.');
    let c={id:uid(),type,number:nextCertNumber(type),student:s.id,date:nonempty(f.get('date'),'Date'),data,by:currentUser?.username||'',cancelled:false};
    await change(n=>{n.certificates.push(c);if(type==='TC'&&f.has('markTransferred')){let x=n.students.find(x=>x.id===s.id);x.status='Transferred'}});setTimeout(()=>printCertificate(c.id,false))});
  let sel=$('#modal [name=student]');attachSelectSearch(sel);let fill=async()=>{let s=student(sel.value);$('#certFields').innerHTML=fields[type](s);$('#certInfo').innerHTML=`<p class="muted">${esc(s.admission)} · Class ${esc(s.class)} / ${esc(s.section)} · DOB ${esc(fmtDate(s.dob))} · Guardian ${esc(s.guardian||'—')}${balance(s.id)>0?' · <b style="color:#c2414d">Fees due '+money(balance(s.id))+'</b>':''}</p>`;
    if(type==='TC'){let y=sessionStartYear(s.session||state.settings.session),r=0,p=0;for(let m of Object.keys(state.attendanceIndex).filter(m=>m>=y+'-04'&&m<=(y+1)+'-03'))for(let day of Object.values(await loadMonth(m))){let c=day[s.id];if(c&&c!=='E'){r++;p+=ATT_VALUE[c]}}if(r){$('#modal [name=workingDays]').value=r;$('#modal [name=presentDays]').value=p}let last=state.payments.filter(x=>x.student===s.id).sort((a,b)=>b.date.localeCompare(a.date))[0];if(last)$('#modal [name=feesPaid]').value=MONTHS[Number(last.date.slice(5,7))-1]+' '+last.date.slice(0,4)}};sel.addEventListener('change',fill);fill()}
async function cancelCertificate(id){let c=state.certificates.find(x=>x.id===id);if(!c||!confirm('Cancel certificate '+c.number+'? It stays in the register marked CANCELLED. The student status is not changed.'))return;await change(n=>{n.certificates.find(x=>x.id===id).cancelled=true});certificatesView()}
function printCertificate(id,duplicate){let c=state.certificates.find(x=>x.id===id),s=student(c.student),d=c.data,p=pron(s),z=state.settings;
  let head=`<div class="certhead">${z.logo?`<img src="${z.logo}" alt="">`:''}<div><h1>${esc(z.name)}</h1><p>${esc(z.address)}${z.recognition?'<br>'+esc(z.recognition):''}${z.phone?' · Phone '+esc(z.phone):''}</p></div></div><div class="certtitle">${esc(CERT_TYPES[c.type]).toUpperCase()}${duplicate?' <span class="dup">DUPLICATE</span>':''}</div><div class="certmeta"><span>No. <b>${esc(c.number)}</b></span><span>Admission No. <b>${esc(s.admission)}</b></span><span>Date: <b>${esc(fmtDate(c.date))}</b></span></div>`,body='';
  if(c.type==='TC'){let rows=[['Name of the student',s.name],['Father’s / Guardian’s name',s.guardian],['Mother’s name',s.mother],['Nationality',d.nationality],['Category',d.category],['Date of birth (in figures)',fmtDate(s.dob)],['Date of birth (in words)',dateWords(s.dob)],['Date of first admission in the school',fmtDate(s.admissionDate)+(d.classAdmitted?' · Class '+d.classAdmitted:'')],['Class in which the student last studied',d.classLast],['Last examination taken and result',d.lastExam],['Whether qualified for promotion',d.promoted],['School dues paid up to',d.feesPaid+(balance(s.id)>0?' (outstanding '+money(balance(s.id))+' on date of issue)':' (no dues)')],['Total working days / days present',[d.workingDays,d.presentDays].filter(Boolean).join(' / ')],['Games / extra-curricular activities',d.activities],['General conduct',d.conduct],['Date of application for certificate',fmtDate(d.applied)],['Date of leaving the school',fmtDate(d.leaving)],['Reason for leaving',d.reason],['Any other remarks',d.remarks]];
    body=`<table class="certtable">${rows.map(([k,v],i)=>`<tr><td>${i+1}.</td><td>${esc(k)}</td><td>${esc(v||'—')}</td></tr>`).join('')}</table><p>Certified that the above information is in accordance with the school admission register.</p>`}
  if(c.type==='Bonafide')body=`<p class="certtext">This is to certify that <b>${esc(s.name)}</b>, ${p.rel} of <b>${esc(s.guardian||'—')}</b>, is a bonafide student of this school, studying in <b>Class ${esc(s.class)}${s.section?' (Section '+esc(s.section)+')':''}</b>${s.roll?', Roll No. '+esc(s.roll):''}, during the academic session <b>${esc(d.session)}</b>.</p><p class="certtext">${p.he}${s.dob?` was born on <b>${esc(fmtDate(s.dob))}</b> (${esc(dateWords(s.dob))}) as per the school admission register`:' is enrolled in the school admission register'}.</p><p class="certtext">This certificate is issued on request for the purpose of <b>${esc(d.purpose)}</b>.</p>`;
  if(c.type==='Character')body=`<p class="certtext">This is to certify that <b>${esc(s.name)}</b>, ${p.rel} of <b>${esc(s.guardian||'—')}</b>, Admission No. ${esc(s.admission)}, was a student of this school from <b>${esc(fmtDate(d.from))}</b> to <b>${esc(fmtDate(d.to))}</b>.</p><p class="certtext">During this period ${p.his} conduct and character were <b>${esc(d.conduct)}</b>. To the best of our knowledge ${p.he.toLowerCase()} bears a good moral character.</p><p class="certtext">We wish ${p.him} every success in life.</p>`;
  preview(`<section class="certificate">${head}${body}<div class="rcsign cert"><span>Prepared by</span><span>Checked by</span><span>Principal<br><small>(with school seal)</small></span></div></section>`)}

// ---------- concessions, late fines, net fee charges ----------
function concessionFor(n,sid,feeKey,gross){let list=n.concessions.filter(c=>c.student===sid),c=list.find(c=>c.fee===feeKey)||list.find(c=>c.fee==='*');if(!c)return {disc:0};let disc=c.type==='percent'?Math.round(gross*c.value/100):Math.min(gross,c.value);return {disc:Math.min(gross,Math.max(0,disc)),c}}
function makeFeeCharge(n,r,s,session,period,date,feeKey=r.id){let {disc,c}=concessionFor(n,s.id,feeKey,r.amount),net=r.amount-disc;if(net<=0)return null;return {id:uid(),student:s.id,date,description:r.name+' · '+session+' · '+period+(disc?' (concession '+money(disc)+(c.reason?' · '+c.reason:'')+')':''),amount:net,gross:r.amount,concession:disc,feeSetting:r.id,feeSession:session,feePeriod:period}}
const netTotal=(n,r,targets,session,period,feeKey)=>targets.reduce((t,s)=>t+(makeFeeCharge(n,r,s,session,period,'2000-01-01',feeKey)?.amount||0),0);
applyFeeForm=function(id){let r=state.feeSettings.find(x=>x.id===id);openForm('Apply '+esc(r.name)+' · '+esc(r.class),field('session','Academic session *',state.settings.session,'text',true)+(r.frequency==='Monthly'?field('period','Fee month *',today().slice(0,7),'month',true):r.frequency==='Termly'?select('period','Term',['Term 1','Term 2','Term 3','Term 4'],'Term 1'):'<p>This fee is applied once per student per academic session.</p>')+field('section','Section (blank = all)')+field('date','Charge date *',today(),'date',true)+`<p class="full">${money(r.amount)} per active student whose class and academic session match, less any concession. Students already charged for this fee and period are skipped.</p>`,async f=>{let session=nonempty(f.get('session'),'Session'),period=feePeriod(r,f),section=f.get('section').trim(),date=nonempty(f.get('date'),'Date'),targets=feeTargets(state,r,session,period,section);if(!targets.length)throw Error('No eligible students. Check their session/class, or whether this period has already been charged.');let total=netTotal(state,r,targets,session,period);
  if(!confirm(`Create charges for ${targets.length} students for ${r.name}, ${session}, ${period}?\nTotal after concessions: ${money(total)}\nThis adds permanent fee charges.`))throw Error('No charges created.');await change(n=>{for(let s of feeTargets(n,r,session,period,section)){let c=makeFeeCharge(n,r,s,session,period,date);if(c)n.charges.push(c)}})})};
allFeePlan=function(f){let freq=f.get('frequency'),session=String(f.get('session')||'').trim(),period=freq==='Monthly'?String(f.get('month')||'').toLowerCase():freq==='Termly'?String(f.get('term')||'').toLowerCase():freq==='Annual'?'annual':'once';let items=state.feeSettings.filter(r=>r.frequency===freq).map(r=>{let t=session&&period?feeTargets(state,r,session,period,''):[];return {r,n:t.length,net:netTotal(state,r,t,session,period)}});return {freq,session,period,items,count:items.reduce((t,i)=>t+i.n,0),total:items.reduce((t,i)=>t+i.net,0)}};
applyAllFeesForm=function(){if(!state.feeSettings.length)return toast('Add class fees first.');
  openForm('Apply fees to all classes',select('frequency','Fee frequency',['Monthly','Termly','Annual','One-time'],'Monthly')+field('session','Academic session *',state.settings.session,'text',true)+`<label>Fee month (monthly fees)<input type="month" name="month" value="${today().slice(0,7)}"></label>`+select('term','Term (termly fees)',['Term 1','Term 2','Term 3','Term 4'],'Term 1')+field('date','Charge date *',today(),'date',true)+'<div class="full" id="applyAllPreview"></div>',async f=>{let p=allFeePlan(f),date=nonempty(f.get('date'),'Date');if(!p.session||!p.period)throw Error('Enter the session and period.');if(!p.count)throw Error('No eligible students. Every matching student is already charged for this period, or student sessions do not match.');if(!confirm(`Create ${p.freq.toLowerCase()} charges for ${p.count} students across ${p.items.filter(i=>i.n).length} fee settings?\nPeriod: ${p.period} · Session: ${p.session}\nTotal after concessions: ${money(p.total)}`))throw Error('No charges created.');
    await change(n=>{for(let {r} of p.items)for(let s of feeTargets(n,r,p.session,p.period,'')){let c=makeFeeCharge(n,r,s,p.session,p.period,date);if(c)n.charges.push(c)}})});
  let form=$('#modal form'),draw=()=>{let p=allFeePlan(new FormData(form));$('#applyAllPreview').innerHTML=`<table><thead><tr><th>Class</th><th>Fee</th><th>Amount</th><th>Students</th><th>Total after concessions</th></tr></thead><tbody>${p.items.map(i=>`<tr><td>${esc(i.r.class)}</td><td>${esc(i.r.name)}</td><td>${money(i.r.amount)}</td><td>${i.n}</td><td>${money(i.net)}</td></tr>`).join('')||`<tr><td colspan="5">No ${esc(p.freq.toLowerCase())} fees are set up.</td></tr>`}</tbody></table><p><b>${p.count} students · ${money(p.total)}</b>. Students already charged for this period are skipped; fully waived students get no charge.</p>`};form.addEventListener('input',draw);form.addEventListener('change',draw);draw()};
feeSettingForm=function(id){let r=state.feeSettings.find(x=>x.id===id)||{class:settingsClass(),frequency:'Monthly',amount:0,fine:0,dueDays:15};openForm(id?'Edit fee setting':'New class fee',select('class','Class',state.classes,r.class)+field('name','Fee name *',r.name,'text',true)+select('frequency','Frequency',['Monthly','Termly','Annual','One-time'],r.frequency)+`<label>Net amount per student (₹)<input type="number" min="0.01" max="10000000" step="0.01" name="amount" value="${r.amount?r.amount/100:''}" required></label><label>Late fine (₹, 0 = no fine)<input type="number" min="0" max="1000000" step="0.01" name="fine" value="${(r.fine||0)/100}"></label><label>Fine applies after (days from charge date)<input type="number" min="0" max="365" step="1" name="dueDays" value="${r.dueDays??15}"></label>`,async f=>{let v={id:id||uid(),class:f.get('class'),name:nonempty(f.get('name'),'Fee name'),frequency:f.get('frequency'),amount:Math.round(Number(f.get('amount'))*100),fine:Math.round(Number(f.get('fine')||0)*100),dueDays:Math.round(Number(f.get('dueDays')||0))};if(!state.classes.includes(v.class)||!Number.isSafeInteger(v.amount)||v.amount<=0||!Number.isSafeInteger(v.fine)||v.fine<0||!(v.dueDays>=0&&v.dueDays<=365))throw Error('Check class, amount, fine and days.');if(state.feeSettings.some(x=>x.id!==id&&x.class===v.class&&x.name.toLowerCase()===v.name.toLowerCase()))throw Error('Fee name already exists in this class.');await change(n=>{let i=n.feeSettings.findIndex(x=>x.id===id);i<0?n.feeSettings.push(v):n.feeSettings[i]=v});settingClass=v.class})};
function outstandingByCharge(n=state){let out=new Map,x=IX(n);for(let [sid,charges] of x.chargesBy){let list=[...charges].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)),rem=new Map(list.map(c=>[c.id,c.amount])),pool=0;for(let p of x.paysBy.get(sid)||[]){if(p.charge&&rem.has(p.charge)){let take=Math.min(rem.get(p.charge),p.amount);rem.set(p.charge,rem.get(p.charge)-take);pool+=p.amount-take}else pool+=p.amount}for(let c of list){let take=Math.min(rem.get(c.id),pool);rem.set(c.id,rem.get(c.id)-take);pool-=take}for(let [k,v] of rem)out.set(k,v)}return out}
function fineCandidates(){let out=outstandingByCharge(),fined=new Set(state.charges.filter(c=>c.fineFor).map(c=>c.fineFor)),fs=new Map(state.feeSettings.map(f=>[f.id,f])),t=today();return state.charges.filter(c=>{let f=fs.get(c.feeSetting);return f?.fine>0&&!c.fineFor&&!fined.has(c.id)&&out.get(c.id)>0&&addDays(c.date,f.dueDays??15)<t&&student(c.student)?.status==='Active'}).map(c=>({c,f:fs.get(c.feeSetting),s:student(c.student),due:addDays(c.date,fs.get(c.feeSetting).dueDays??15),left:out.get(c.id)}))}
function lateFinesForm(){let list=fineCandidates(),total=list.reduce((t,x)=>t+x.f.fine,0);$('#modal').innerHTML=`<h2>Late fines</h2><p class="muted">A fine is added once per unpaid fee when the fee is still unpaid after its due date (set in each fee setting). Payments not linked to a fee are counted against the oldest fees first. Fines are never added twice for the same fee.</p><div class="reportsum"><span>Fines to add<b>${list.length}</b></span><span>Total<b>${money(total)}</b></span></div><div class="scroll" style="max-height:380px"><table><thead><tr><th>Student</th><th>Fee</th><th>Was due</th><th>Unpaid</th><th>Fine</th></tr></thead><tbody>${list.slice(0,300).map(x=>`<tr><td>${esc(x.s.name)}<br><small>${esc(x.s.admission)} · ${esc(x.s.class)}</small></td><td>${esc(x.c.description)}</td><td>${esc(fmtDate(x.due))}</td><td>${money(x.left)}</td><td>${money(x.f.fine)}</td></tr>`).join('')||'<tr><td colspan="5">No late fines are due today.</td></tr>'}</tbody></table></div>${list.length>300?'<p class="muted">Showing the first 300.</p>':''}<div class="actions"><button class="secondary" onclick="closeModal()">Close</button><button ${list.length?'':'disabled'} onclick="applyLateFines(this)">Add ${list.length} fines</button></div>`;$('#modal').showModal()}
async function applyLateFines(btn){let list=fineCandidates();if(!list.length||!confirm('Add '+list.length+' late fines totalling '+money(list.reduce((t,x)=>t+x.f.fine,0))+'?'))return;btn.disabled=true;try{let d=today();await change(n=>{for(let x of list)n.charges.push({id:uid(),student:x.c.student,date:d,description:'Late fine · '+x.c.description,amount:x.f.fine,fineFor:x.c.id})});closeModal();render();toast(list.length+' late fines added.')}catch(e){toast(e.message)}finally{btn.disabled=false}}
function concessionForm(id){let c=state.concessions.find(x=>x.id===id)||{type:'percent',value:0,fee:'*',reason:''};let sid=c.student||state.students.find(s=>s.status==='Active')?.id;if(!sid)return toast('Add students first.');
  openForm(id?'Edit concession':'Add concession',studentPicker('student','Student *',sid,state.students.filter(s=>s.status==='Active'||s.id===c.student))+'<label class="full">Applies to<select name="fee"></select></label>'+`<label>Concession type<select name="type"><option value="percent" ${c.type==='percent'?'selected':''}>Percentage of the fee</option><option value="amount" ${c.type==='amount'?'selected':''}>Fixed amount (₹) off each charge</option></select></label>`+`<label>Value (percent, or ₹ per charge)<input type="number" name="value" min="0" step="0.01" value="${c.type==='amount'?c.value/100:c.value}" required></label>`+field('reason','Reason (e.g. Sibling, Staff ward, Merit)',c.reason)+'<p class="full muted">Used automatically when fees are applied to a class or the whole school. Charges already created are not changed.</p>',async f=>{let v={id:id||uid(),student:f.get('student'),fee:f.get('fee'),type:f.get('type'),value:Number(f.get('value')),reason:f.get('reason').trim()};if(!student(v.student))throw Error('Select a student.');if(v.type==='percent'){if(!(v.value>0&&v.value<=100))throw Error('Percentage must be between 0 and 100.')}else{v.value=Math.round(v.value*100);if(!Number.isSafeInteger(v.value)||v.value<=0)throw Error('Enter a positive amount.')}
    if(state.concessions.some(x=>x.id!==v.id&&x.student===v.student&&x.fee===v.fee))throw Error('This student already has a concession for that fee. Edit it instead.');await change(n=>{let i=n.concessions.findIndex(x=>x.id===v.id);i<0?n.concessions.push(v):n.concessions[i]=v})});
  let sel=$('#modal [name=student]'),fee=$('#modal [name=fee]'),fill=()=>{let s=student(sel.value);fee.innerHTML=`<option value="*">All fees (class fees and hostel)</option>${state.feeSettings.filter(f=>f.class===s?.class).map(f=>`<option value="${f.id}">${esc(f.name)} · ${money(f.amount)}</option>`).join('')}<option value="hostel">Hostel fee</option>`;if([...fee.options].some(o=>o.value===c.fee))fee.value=c.fee};attachSelectSearch(sel);sel.addEventListener('change',fill);fill()}

const preV4FeeSettings=feeSettings;feeSettings=function(){preV4FeeSettings();document.querySelectorAll('#view tbody tr').forEach(tr=>{let id=tr.querySelector('button[onclick^="applyFeeForm"]')?.getAttribute('onclick').match(/'(.+)'/)?.[1],f=state.feeSettings.find(x=>x.id===id);if(f?.fine)tr.children[2].insertAdjacentHTML('beforeend',`<br><small class="muted">Fine ${money(f.fine)} after ${f.dueDays??15} days</small>`)});

function staffForm(id){let s=state.staff.find(x=>x.id===id)||{status:'Active',staffId:'STF'+String(state.staff.length+1).padStart(3,'0'),joinDate:today()};openForm(id?'Edit staff':'Add staff',field('staffId','Staff ID *',s.staffId,'text',true)+field('name','Full name *',s.name,'text',true)+field('designation','Designation (e.g. TGT English, Clerk)',s.designation)+field('subjects','Subjects taught',s.subjects)+field('qualification','Qualification',s.qualification)+field('phone','Phone',s.phone,'tel')+field('email','Email',s.email,'email')+field('joinDate','Date of joining',s.joinDate,'date')+`<label>Monthly salary (₹)<input type="number" name="salary" min="0" step="0.01" value="${(s.salary||0)/100}"></label>`+select('status','Status',['Active','On leave','Left'],s.status)+`<label class="full">Address<textarea name="address" maxlength="1000">${esc(s.address)}</textarea></label><label>Photo<input type="file" name="photo" accept="image/png,image/jpeg,image/webp"></label><label>Remove photo<input type="checkbox" name="removePhoto" style="width:auto"></label>`,async f=>{let v={id:id||uid()};for(let k of ['staffId','name','designation','subjects','qualification','phone','email','joinDate','status','address'])v[k]=String(f.get(k)||'').trim();nonempty(v.name,'Name');nonempty(v.staffId,'Staff ID');v.salary=Math.round(Number(f.get('salary')||0)*100);if(!Number.isSafeInteger(v.salary)||v.salary<0)throw Error('Enter a valid salary.');if(state.staff.some(x=>x.id!==v.id&&x.staffId.toLowerCase()===v.staffId.toLowerCase()))throw Error('Staff ID already used.');v.photo=await imageData(f.get('photo'),f.has('removePhoto')?'':s.photo);await change(n=>{let i=n.staff.findIndex(x=>x.id===v.id);i<0?n.staff.push(v):n.staff[i]=v})})}
async function deleteStaff(id){let s=state.staff.find(x=>x.id===id);if(state.salaries.some(r=>r.staff===id))return toast('This staff member has salary records. Set the status to “Left” instead.');if(Object.values(state.timetable).some(t=>Object.values(t).some(d=>d.some(c=>c?.t===id))))return toast('This staff member is in the timetable. Change those periods first, or set status to “Left”.');if(confirm('Delete '+s.name+'?')){await change(n=>{n.staff=n.staff.filter(x=>x.id!==id);n.users.forEach(u=>{if(u.staff===id)u.staff=''})});render()}}
async function prepareSalaries(){let have=new Set(state.salaries.filter(r=>r.month===salMonth).map(r=>r.staff)),list=state.staff.filter(s=>s.status!=='Left'&&!have.has(s.id));if(!list.length)return toast('Every working staff member already has an entry for '+salMonth+'.');if(!confirm('Create unpaid salary entries for '+list.length+' staff for '+salMonth+' using their monthly salary?'))return;await change(n=>{for(let s of list)n.salaries.push({id:uid(),staff:s.id,month:salMonth,basic:s.salary||0,allowance:0,deduction:0,net:s.salary||0,status:'Unpaid',paidDate:'',mode:'',note:''})});staffView()}
function salaryForm(id){let r=state.salaries.find(x=>x.id===id),s=state.staff.find(x=>x.id===r.staff),rs=p=>p/100;openForm('Salary · '+esc(s?.name)+' · '+esc(r.month),`<label>Basic (₹)<input type="number" name="basic" min="0" step="0.01" value="${rs(r.basic)}"></label><label>Allowances (₹)<input type="number" name="allowance" min="0" step="0.01" value="${rs(r.allowance)}"></label><label>Deductions (₹) — PF, advance, leave<input type="number" name="deduction" min="0" step="0.01" value="${rs(r.deduction)}"></label>`+select('status','Status',['Unpaid','Paid'],r.status)+field('paidDate','Paid on',r.paidDate||today(),'date')+select('mode','Payment mode',['Bank transfer','Cash','Cheque','UPI'],r.mode||'Bank transfer')+field('note','Note (e.g. cheque no., leave days)',r.note),async f=>{let v={...r};for(let k of ['basic','allowance','deduction']){v[k]=Math.round(Number(f.get(k)||0)*100);if(!Number.isSafeInteger(v[k])||v[k]<0)throw Error('Check the amounts.')}v.net=v.basic+v.allowance-v.deduction;if(v.net<0)throw Error('Deductions are larger than the salary.');v.status=f.get('status');v.paidDate=v.status==='Paid'?nonempty(f.get('paidDate'),'Paid on'):'';v.mode=v.status==='Paid'?f.get('mode'):'';v.note=f.get('note').trim();await change(n=>{let i=n.salaries.findIndex(x=>x.id===id);n.salaries[i]=v})})}
async function deleteSalary(id){if(confirm('Delete this salary entry?')){await change(n=>n.salaries=n.salaries.filter(r=>r.id!==id));staffView()}}
function printSalaryRegister(){let recs=state.salaries.filter(r=>r.month===salMonth),t=k=>recs.reduce((x,r)=>x+r[k],0);preview(printHead('Salary register · '+salMonth)+`<table><thead><tr><th>No.</th><th>Staff</th><th>Designation</th><th>Basic</th><th>Allowances</th><th>Deductions</th><th>Net</th><th>Paid on / mode</th><th>Signature</th></tr></thead><tbody>${recs.map((r,i)=>{let s=state.staff.find(x=>x.id===r.staff);return `<tr><td>${i+1}</td><td>${esc(s?.name)}<br><small>${esc(s?.staffId)}</small></td><td>${esc(s?.designation)}</td><td>${money(r.basic)}</td><td>${money(r.allowance)}</td><td>${money(r.deduction)}</td><td>${money(r.net)}</td><td>${r.status==='Paid'?esc(fmtDate(r.paidDate))+'<br>'+esc(r.mode):'Unpaid'}</td><td style="width:18%"></td></tr>`}).join('')}</tbody><tfoot><tr><th></th><th>Total</th><th></th><th>${money(t('basic'))}</th><th>${money(t('allowance'))}</th><th>${money(t('deduction'))}</th><th>${money(t('net'))}</th><th></th><th></th></tr></tfoot></table><p style="margin-top:40px">Accountant: ____________________ &nbsp; Principal: ____________________</p>`)}
function paySlip(id){let r=state.salaries.find(x=>x.id===id),s=state.staff.find(x=>x.id===r.staff),[y,m]=r.month.split('-');preview(printHead('Salary slip · '+MONTHS[m-1]+' '+y)+`<table class="rcinfo"><tr><th>Name</th><td><b>${esc(s?.name)}</b></td><th>Staff ID</th><td>${esc(s?.staffId)}</td></tr><tr><th>Designation</th><td>${esc(s?.designation)}</td><th>Date of joining</th><td>${esc(fmtDate(s?.joinDate))}</td></tr></table><table><thead><tr><th>Earnings</th><th>Amount</th><th>Deductions</th><th>Amount</th></tr></thead><tbody><tr><td>Basic salary</td><td>${money(r.basic)}</td><td>Deductions</td><td>${money(r.deduction)}</td></tr><tr><td>Allowances</td><td>${money(r.allowance)}</td><td>${esc(r.note)}</td><td></td></tr></tbody><tfoot><tr><th>Gross</th><th>${money(r.basic+r.allowance)}</th><th>Net pay</th><th>${money(r.net)}</th></tr></tfoot></table><p>Net pay in words: <b>${esc(rupeeWords(r.net))}</b></p><p>Status: ${r.status==='Paid'?'Paid on '+esc(fmtDate(r.paidDate))+' by '+esc(r.mode):'Unpaid'}</p><div class="rcsign"><span>Employee</span><span>Accountant</span><span>Principal</span></div>`)}
function printStaffList(){preview(printHead('Staff list')+`<table><thead><tr><th>No.</th><th>Staff ID</th><th>Name</th><th>Designation</th><th>Subjects</th><th>Qualification</th><th>Phone</th><th>Joined</th></tr></thead><tbody>${state.staff.filter(s=>s.status!=='Left').sort((a,b)=>a.name.localeCompare(b.name)).map((s,i)=>`<tr><td>${i+1}</td><td>${esc(s.staffId)}</td><td>${esc(s.name)}</td><td>${esc(s.designation)}</td><td>${esc(s.subjects)}</td><td>${esc(s.qualification)}</td><td>${esc(s.phone)}</td><td>${esc(fmtDate(s.joinDate))}</td></tr>`).join('')}</tbody></table>`)}

// ---------- timetable ----------
const DEFAULT_PERIODS=['08:50–09:30','09:30–10:10','10:10–10:50','10:50–11:30','12:00–12:40','12:40–13:20','13:20–14:00','14:00–14:40'];
const ttDays=()=>state.config.ttDays||['Mon','Tue','Wed','Thu','Fri','Sat'],ttPeriods=()=>state.config.ttPeriods||DEFAULT_PERIODS;
let ttClass='',ttSection='A',ttTeacher='',ttTab='class';
const ttKey=(c,s)=>c+'|'+(s||'');
function ttClashes(){let seen=new Map,clash=new Set;for(let [key,t] of Object.entries(state.timetable))for(let [d,row] of Object.entries(t))row.forEach((c,p)=>{if(!c?.t)return;let k=c.t+'|'+d+'|'+p;if(seen.has(k)){clash.add(k);seen.get(k).push(key)}else seen.set(k,[key])});return {clash,seen}}
function timetableView(){let cls=allowedClasses(),editable=can('timetable');if(!cls.includes(ttClass))ttClass=cls[0]||'';let secs=[...new Set(state.students.filter(s=>s.class===ttClass&&s.status==='Active').map(s=>s.section||''))].sort();if(!secs.includes(ttSection))secs.push(ttSection);
  let staff=state.staff.filter(s=>s.status!=='Left').sort((a,b)=>a.name.localeCompare(b.name)),t=state.timetable[ttKey(ttClass,ttSection)]||{},{clash,seen}=ttClashes(),subjects=[...new Set(state.classSubjects.filter(s=>s.class===ttClass).map(s=>s.name))];
  if(!ttTeacher&&currentUser?.staff)ttTeacher=currentUser.staff;
  let tabs=`<div class="tabs">${[['class','Class timetable'],['teacher','Teacher timetable'],...(editable?[['settings','Periods & days']]:[])].map(([k,l])=>`<button class="${ttTab===k?'':'secondary'}" onclick="ttTab='${k}';timetableView()">${l}</button>`).join('')}</div>`;
  if(ttTab==='settings'){$('#view').innerHTML=`<div class="panel">${tabs}<h2>Periods and days</h2><form id="ttSet"><label>Period times — one per line<textarea name="periods" rows="10">${esc(ttPeriods().join('\n'))}</textarea></label><label>School days (comma separated)<input name="days" value="${esc(ttDays().join(', '))}"></label><div class="actions"><button>Save</button></div></form><p class="muted">Changing the number of periods keeps existing entries for the periods that remain.</p></div>`;$('#ttSet').onsubmit=async e=>{e.preventDefault();let p=e.target.periods.value.split('\n').map(x=>x.trim()).filter(Boolean),d=e.target.days.value.split(',').map(x=>x.trim()).filter(Boolean);if(!p.length||p.length>14||!d.length||d.length>7)return toast('Enter 1–14 periods and 1–7 days.');await change(n=>{n.config.ttPeriods=p;n.config.ttDays=d});toast('Saved');timetableView()};return}
  if(ttTab==='teacher'){$('#view').innerHTML=`<div class="panel">${tabs}<div class="toolbar"><select onchange="ttTeacher=this.value;timetableView()"><option value="">Choose teacher</option>${staff.map(s=>`<option value="${s.id}" ${s.id===ttTeacher?'selected':''}>${esc(s.name)}</option>`).join('')}</select><button class="secondary" onclick="printTeacherTT()">Print</button></div><div id="ttGrid">${teacherGrid(ttTeacher)}</div></div>`;return}
  $('#view').innerHTML=`<div class="panel">${tabs}<div class="toolbar"><label>Class<select onchange="ttClass=this.value;timetableView()">${opts(cls,ttClass)}</select></label><label>Section<select onchange="ttSection=this.value;timetableView()">${secs.map(s=>`<option ${s===ttSection?'selected':''}>${esc(s)}</option>`).join('')}</select></label>${editable?`<label>New section<input placeholder="e.g. C" onchange="ttSection=this.value.trim();timetableView()" style="max-width:110px"></label>`:''}<button class="secondary" onclick="printClassTT([ttKey(ttClass,ttSection)])">Print</button><button class="secondary" onclick="printClassTT(Object.keys(state.timetable).sort())">Print all classes</button></div>${!staff.length&&editable?'<p class="notice">Add teachers under Staff & Salary to choose them here.</p>':''}
  <form id="ttForm"><datalist id="ttSubjects">${subjects.map(s=>`<option value="${esc(s)}">`).join('')}</datalist><div class="scroll"><table class="tt"><thead><tr><th>Day</th>${ttPeriods().map((p,i)=>`<th>${i+1}<br><small>${esc(p)}</small></th>`).join('')}</tr></thead><tbody>${ttDays().map(d=>`<tr><th>${esc(d)}</th>${ttPeriods().map((_,i)=>{let c=t[d]?.[i]||{},isClash=c.t&&clash.has(c.t+'|'+d+'|'+i);return `<td class="${isClash?'clash':''}" ${isClash?`title="Also teaching: ${esc(seen.get(c.t+'|'+d+'|'+i).filter(k=>k!==ttKey(ttClass,ttSection)).map(k=>k.replace('|',' ')).join(', '))}"`:''}>${editable?`<input list="ttSubjects" data-d="${esc(d)}" data-p="${i}" class="tts" value="${esc(c.s||'')}" placeholder="Subject"><select data-d="${esc(d)}" data-p="${i}" class="ttt"><option value="">—</option>${staff.map(s=>`<option value="${s.id}" ${s.id===c.t?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`:`<b>${esc(c.s||'')}</b><br><small>${esc(state.staff.find(s=>s.id===c.t)?.name||'')}</small>`}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>${editable?'<div class="actions"><button>Save timetable</button></div>':''}</form>${clash.size?`<p class="notice warnnotice"><b>${clash.size} teacher clash(es):</b> a teacher is placed in two classes in the same period. Red cells show clashes for this class; hover to see the other class.</p>`:''}</div>`;
  if(editable)$('#ttForm').onsubmit=async e=>{e.preventDefault();let grid={};for(let d of ttDays())grid[d]=ttPeriods().map((_,i)=>{let s=$(`#ttForm .tts[data-d="${CSS.escape(d)}"][data-p="${i}"]`).value.trim(),te=$(`#ttForm .ttt[data-d="${CSS.escape(d)}"][data-p="${i}"]`).value;return s||te?{s,t:te}:null});
    let key=ttKey(ttClass,ttSection),empty=Object.values(grid).every(r=>r.every(c=>!c));await change(n=>{if(empty)delete n.timetable[key];else n.timetable[key]=grid});let c=ttClashes().clash.size;toast(c?'Saved — '+c+' teacher clash(es) to fix':'Timetable saved');timetableView()}}
function teacherGrid(tid){if(!tid)return '<p class="muted">Choose a teacher.</p>';let cells={};for(let [key,t] of Object.entries(state.timetable))for(let [d,row] of Object.entries(t))row.forEach((c,p)=>{if(c?.t===tid)(cells[d+'|'+p]??=[]).push(key.replace('|',' ')+(c.s?' · '+c.s:''))});let n=Object.values(cells).reduce((a,b)=>a+b.length,0);
  return `<table class="tt"><thead><tr><th>Day</th>${ttPeriods().map((p,i)=>`<th>${i+1}<br><small>${esc(p)}</small></th>`).join('')}</tr></thead><tbody>${ttDays().map(d=>`<tr><th>${esc(d)}</th>${ttPeriods().map((_,i)=>{let x=cells[d+'|'+i]||[];return `<td class="${x.length>1?'clash':''}">${x.map(esc).join('<br>')}</td>`}).join('')}</tr>`).join('')}</tbody></table><p>${n} periods per week.</p>`}
function ttGridHTML(key){let t=state.timetable[key]||{};return `<table class="tt"><thead><tr><th>Day</th>${ttPeriods().map((p,i)=>`<th>${i+1}<br><small>${esc(p)}</small></th>`).join('')}</tr></thead><tbody>${ttDays().map(d=>`<tr><th>${esc(d)}</th>${ttPeriods().map((_,i)=>{let c=t[d]?.[i];return `<td>${c?`<b>${esc(c.s)}</b><br><small>${esc(state.staff.find(s=>s.id===c.t)?.name||'')}</small>`:''}</td>`}).join('')}</tr>`).join('')}</tbody></table>`}
function printClassTT(keys){if(!keys.length)return toast('No timetables saved yet.');preview(keys.map(k=>`<section class="ttpage">${printHead('Class timetable · '+k.replace('|',' '))}${ttGridHTML(k)}<p style="margin-top:30px">Class teacher: ____________________ &nbsp; Principal: ____________________</p></section>`).join(''))}
function printTeacherTT(){let s=state.staff.find(x=>x.id===ttTeacher);if(!s)return toast('Choose a teacher.');preview(printHead('Teacher timetable · '+s.name)+teacherGrid(s.id))}

// ---------- backup validation for v4 records ----------
const preV4Valid=validBackup;validBackup=function(n){preV4Valid(n);let ids=new Set(n.students.map(s=>s.id)),idOk=x=>typeof x==='string'&&/^[a-zA-Z0-9-]+$/.test(x),img=x=>!x||typeof x==='string'&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x),uniq=(arr,label)=>{let s=new Set;for(let r of arr){if(!r||!idOk(r.id)||s.has(r.id))throw Error('Invalid '+label+'.');s.add(r.id)}return s};
  uniq(n.certificates,'certificate');for(let c of n.certificates)if(!CERT_TYPES[c.type]||!ids.has(c.student)||typeof c.number!=='string'||!c.data||typeof c.data!=='object')throw Error('Invalid certificate.');
  uniq(n.concessions,'concession');for(let c of n.concessions)if(!ids.has(c.student)||!['percent','amount'].includes(c.type)||!Number.isFinite(c.value)||c.value<0||c.type==='percent'&&c.value>100)throw Error('Invalid concession.');
  let staff=uniq(n.staff,'staff record');for(let s of n.staff)if(typeof s.name!=='string'||!s.name.trim()||!img(s.photo)||!Number.isSafeInteger(s.salary||0))throw Error('Invalid staff record.');
  uniq(n.salaries,'salary entry');for(let r of n.salaries)if(!staff.has(r.staff)||!/^\d{4}-\d{2}$/.test(r.month)||!['basic','allowance','deduction','net'].every(k=>Number.isSafeInteger(r[k])))throw Error('Invalid salary entry.');
  if(typeof n.timetable!=='object'||typeof n.config!=='object')throw Error('Invalid timetable or settings.');return n};

// ---------- permission guards on actions ----------
for(let [name,perm] of [['editStudent','editStudents'],['importStudentsForm','editStudents'],['bulkPhotoForm','editStudents'],['rankHolderForm','editStudents'],['removeRankHolder','editStudents'],['addClass','classes'],['renameClass','classes'],['removeClass','classes'],['runPromotion','editStudents'],['runWholeSchool','editStudents'],['applyAllFeesForm','fees'],['applyFeeForm','fees'],['feeSettingForm','fees'],['concessionForm','fees'],['applyLateFines','fees'],['hostelRoomForm','hostel'],['hostelStayForm','hostel'],['userForm','*'],['removeUser','*'],['staffForm','*'],['salaryForm','*'],['prepareSalaries','*']]){let prev=window[name];window[name]=function(...a){if(!(perm==='*'?role()==='admin':can(perm)))return toast('Your login does not allow this.');return prev(...a)}}

const preV4Help=help;help=function(){preV4Help();$('#view').insertAdjacentHTML('afterbegin',`<div class="panel"><h2>Version 4.0 — what’s new</h2><p><b>Staff logins</b> (Settings & Backup): Administrator, Office staff, Cashier, Teacher (optionally limited to their classes) and Hostel warden. Each sees only their pages. Everyone changes their own password with “My password”.</p><p><b>Examinations:</b> grades and class position on marks sheets, “Show top 3 on dashboard”, and <b>Report cards…</b> (one A4 page per student for all exams of the session, with attendance).</p><p><b>Certificates:</b> Transfer, Bonafide and Character certificates with serial numbers and a register. <b>Messages:</b> fee reminders, absentee alerts and notices by WhatsApp or SMS.</p><p><b>Fee Settings:</b> concessions (sibling, staff ward…), late fines after a due date. <b>Hostel:</b> monthly room fees and daily roll call. <b>Staff & Salary</b> and <b>Timetable</b> with clash warnings. <b>UPI:</b> add the school UPI ID in Settings to print a payment QR on fee demand slips.</p><p><b>Backups</b> are now compressed .mcbak files, much smaller than before.</p></div>`)};

window.addEventListener('unhandledrejection',e=>{toast('Could not complete operation: '+e.reason?.message);e.preventDefault()});
const preBrandUpgrade=upgradeData;upgradeData=function(n){preBrandUpgrade(n);if(n.settings){n.settings.name=brandName(n.settings.name);if(!n.settings.logo)n.settings.logo=DEFAULT_LOGO;if(/ebenezer/i.test(n.settings.address||''))n.settings.address='Mission Veng, Leimakhong, Manipur'}return n};
start();
